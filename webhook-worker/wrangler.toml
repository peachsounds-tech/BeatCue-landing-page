name = "peachsounds-webhook"
main = "worker.js"
compatibility_date = "2024-01-01"

# Uncomment and set your account_id if needed
# account_id = "your-cloudflare-account-id"

[vars]
# Non-secret environment variables go here
# POSTHOG_API_KEY is hardcoded in worker.js for simplicity

# ─── Free-key gate (A/B) ──────────────────────────────────────────────────────
# Lemon Squeezy product / variant ids whose license keys sign tier "free"
# instead of "pro". Comma-separated. The worker also compiles these ids in as a
# floor (DEFAULT_FREE_PRODUCT_IDS), so a missing var can never turn a free key
# into Pro. "BeatCue - Free" = product 1385673, variant 2164536.
FREE_PRODUCT_IDS = "1385673"
FREE_VARIANT_IDS = "2164536"

# Experiment start, ms epoch or ISO date. Devices whose quota account was
# created before this are arm=existing: keyless free tier as today, never
# gated. While unset, every device resolves to arm=existing, i.e. the
# experiment is off. Set it when the gated app build ships.
EXPERIMENT_START = ""

# Share of new devices (0-100) assigned to arm=test. Deterministic per device:
# sha256(EXPERIMENT_SALT + device_id). 0 stops new test enrollments; devices
# already assigned keep their arm.
TEST_PERCENT = "0"
EXPERIMENT_SALT = "free-key-gate-v1"

# Emergency rollback. "false" releases every gated device back to the keyless
# free tier on its next resolve, with no app release.
GATE_ENABLED = "true"

# Secret variables (set via `wrangler secret put NAME`):
#
#   LEMONSQUEEZY_WEBHOOK_SECRET    Lemon Squeezy → /webhook/lemonsqueezy HMAC.
#                                  Optional; signature check is skipped when
#                                  unset.
#
#   META_PIXEL_ID                  Meta Pixel numeric ID for /capi events.
#                                  Must be set; /capi returns 503 otherwise.
#                                  Today: 708429622326201 (matches the pixel
#                                  loaded from landing-page/download.html).
#
#   META_CAPI_TOKEN                Conversions API access token. Generate in
#                                  Events Manager → Settings → Conversions API
#                                  → "Generate access token". Treat as a
#                                  password — never commit, never ship to the
#                                  desktop app or browser.
#
#   META_TEST_EVENT_CODE           Optional. Set during verification so events
#                                  land in Events Manager → Test Events
#                                  instead of prod attribution. Delete with
#                                  `wrangler secret delete META_TEST_EVENT_CODE`
#                                  once the integration is verified.
#
#   GOOGLE_ADS_DEVELOPER_TOKEN     Google Ads API developer token.
#   GOOGLE_ADS_CLIENT_ID           OAuth client ID (Desktop / Web app).
#   GOOGLE_ADS_CLIENT_SECRET       OAuth client secret.
#   GOOGLE_ADS_REFRESH_TOKEN       Long-lived refresh token for an Ads user.
#   GOOGLE_ADS_CUSTOMER_ID         Ads customer ID (digits only, no dashes).
#   GOOGLE_ADS_LOGIN_CUSTOMER_ID   Optional MCC / manager customer ID.
#   GOOGLE_ADS_CONV_ACTIONS        JSON map of event_name → conversion action
#                                  resource name, e.g.
#                                  {"send_to_desktop":"customers/123/conversionActions/456",
#                                   "trial_download":"customers/123/conversionActions/789"}
#   GOOGLE_ADS_VALIDATE_ONLY       Optional. Set to "1" to dry-run uploads
#                                  (validateOnly=true, no attribution).
#
#   QUOTA_ADMIN_TOKEN              Shared secret for POST /quota/grant, the
#                                  support lever for granting a user extra
#                                  songs or a clean period. /quota/grant
#                                  returns 503 while unset, so the endpoint is
#                                  inert until you deliberately enable it.
#
#   ENTITLEMENT_SIGNING_KEY        Base64 PKCS8 Ed25519 private key used to sign
#                                  entitlement tokens for both the quota and
#                                  licence routes. The matching public key is
#                                  compiled into the desktop app
#                                  (ENTITLEMENT_PUBLIC_KEY in LicenseConfig.h).
#                                  Generate the pair with
#                                  scripts/gen_signing_key.mjs. If unset, the
#                                  worker still answers but omits the `signed`
#                                  field, which new clients treat as "offline".

# ─── Pairing KV ───────────────────────────────────────────────────────────────
# Stores pending web→app pairing payloads (bcid + Meta attribution) for ~30
# minutes between download and first app launch. One write per download, one
# read+delete per first launch. Free tier (1k writes/day) is plenty until
# >1k installs/day.
#
# First-time setup:
#   1. wrangler kv namespace create PAIRINGS
#      → prints an `id = "..."` line; paste it into the binding below.
#   2. wrangler kv namespace create PAIRINGS --preview
#      → prints a `preview_id = "..."` line; paste that for `wrangler dev`.
#   3. wrangler deploy
[[kv_namespaces]]
binding = "PAIRINGS"
id = "ec35a8800c954b81a7c3d2a3512b5cd6"
preview_id = "abf00fa20f7347dcbe0f3a2d70c90fb1"

# ─── Free-tier quota D1 ───────────────────────────────────────────────────────
# Authoritative ledger of which songs each install owns and how many slots it
# has used this period. D1 rather than KV because a claim is a read-modify-write
# and KV's eventual consistency would let a client double-claim; the conditional
# INSERT in handleQuotaClaim needs real SQL semantics.
#
# Provisioned and migrated; the id below is live. Recreating from scratch:
#   1. wrangler d1 create beatcue-quota
#      (prints a `database_id = "..."` line; paste it below)
#   2. wrangler d1 migrations apply beatcue-quota --local
#      (the local copy backing `wrangler dev`)
#   3. wrangler d1 migrations apply beatcue-quota --remote
#      (--remote is required: wrangler 4 targets the local copy by default, so
#       omitting it re-applies to the wrong database and reports success)
#   4. wrangler deploy
#
# Changing the free-tier limit afterwards needs no release:
#   wrangler d1 execute beatcue-quota --remote \
#     --command "UPDATE quota_config SET value='5' WHERE key='default_limit'"
[[d1_databases]]
binding = "QUOTA_DB"
database_name = "beatcue-quota"
database_id = "f6e89ad1-6113-4d53-bac7-9ca8bf754253"
migrations_dir = "migrations"

# ─── Static assets opt-out ────────────────────────────────────────────────────
# Wrangler v4 auto-prompts "Workers with static assets?" when no [assets]
# block is present and a sibling/parent folder looks asset-like. In CI /
# non-interactive shells the prompt auto-answers yes, which makes wrangler
# walk up to ../landing-page (3700+ files, including a 34 MiB .mov) and
# fail with "Asset too large". This worker is a pure API endpoint with no
# static surface, so we point [assets] at a deliberately empty local dir
# to short-circuit that scan.
[assets]
directory = "./empty-assets"


