    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose your plan — BeatCue</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script>
        // ============================================
        // PRODUCT REDIRECT
        // Change this URL when switching from early access to paid product.
        // During early access: points to LemonSqueezy free checkout
        // After launch: point to the paid checkout URL
        // ============================================
        // Legacy entry point. Older shipped app builds (and any old ad/email
        // links) open beatcue.app/get. Instead of dropping straight into a
        // single LemonSqueezy product, forward to the /plans chooser so the
        // buyer picks Pro or Lifetime. Query params (email, bcid, click-ids)
        // are carried through untouched; /plans maps them onto checkout links.
        const PLANS_URL = '/plans';
        const POSTHOG_API_KEY  = 'phc_glfQoJ0XvIyNUy1Q6baVxMLolADg69F9H262U0TiRuG';
        const POSTHOG_API_HOST = 'https://t.beatcue.app';

        const params = new URLSearchParams(window.location.search);
        const email = params.get('email');
        const redirect = new URL(PLANS_URL, window.location.origin);
        // Carry every incoming param straight through to /plans.
        params.forEach(function (v, k) { redirect.searchParams.set(k, v); });
        if (!redirect.searchParams.get('source')) redirect.searchParams.set('source', 'get');

        // Resolve the bcid the same way the landing page does, so a checkout
        // opened from the plugin (which passes ?bcid=) or from a browser that
        // has already seen the site keeps one identity through to the webhook.
        // Kept in sync with getOrCreateBcid() in ../index.html.
        const bcid = (function () {
            const VALID = /^bc_[A-Za-z0-9-]{8,64}$/;
            const normalize = function (raw) {
                if (!raw || typeof raw !== 'string') return null;
                let trimmed = raw.trim();
                if (!trimmed) return null;
                if (!/^bc_/.test(trimmed)) trimmed = 'bc_' + trimmed;
                return VALID.test(trimmed) ? trimmed : null;
            };
            try {
                return normalize(params.get('bcid') || params.get('ph_id'))
                    || normalize(localStorage.getItem('cue_bcid'))
                    || normalize(sessionStorage.getItem('cue_bcid'));
            } catch (e) {
                return null;
            }
        })();
        // Deliberately not minted here. A fresh id would only create another
        // orphan person; absent is more honest than invented. /plans mints one
        // if truly needed.
        if (bcid && !redirect.searchParams.get('bcid')) redirect.searchParams.set('bcid', bcid);

        // Breadcrumb so a legacy /get hit is still visible in analytics before
        // the hop to /plans. No SDK: the PostHog snippet is async and would not
        // flush before location.replace(); keepalive is what carries this one.
        try {
            fetch(POSTHOG_API_HOST + '/e/', {
                method: 'POST',
                mode: 'cors',
                credentials: 'omit',
                keepalive: true,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    api_key: POSTHOG_API_KEY,
                    event: 'get_redirect_to_plans',
                    distinct_id: bcid || ('anon_get_' + Date.now()),
                    timestamp: new Date().toISOString(),
                    properties: {
                        $lib: 'web-get',
                        $lib_version: '1.0.0',
                        $current_url: window.location.href,
                        $pathname: window.location.pathname,
                        $referrer: document.referrer || '$direct',
                        page: 'get',
                        source: 'get_redirect',
                        had_bcid: !!bcid,
                        from_email_param: !!email
                    }
                })
            }).catch(function () {});
        } catch (e) { /* never block the redirect on analytics */ }

        // Leave immediately. The breadcrumb above is sent with keepalive, which
        // is what lets the request outlive this document.
        window.location.replace(redirect.toString());
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0;url=/plans">
    </noscript>
</head>

</body>
